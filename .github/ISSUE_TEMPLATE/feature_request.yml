name: ✨ Feature Request
description: Propose a new capability or enhancement for ANVIL
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement to ANVIL!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or limitation you are facing.
      placeholder: I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Desired Feature
      description: Describe the solution you'd like to see.
      placeholder: It would be great if ANVIL could [...]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
  - type: checkboxes
    id: checklist
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a Pull Request for this feature once discussed and approved by the maintainer.
