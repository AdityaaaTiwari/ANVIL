name: ANVIL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, test, and build (${{ matrix.os }}, Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Security audit
        run: |
          npm audit --audit-level=high --omit=dev --json > npm-audit.json || true
          npm audit --audit-level=high --omit=dev
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: npm-dependency-audit-${{ matrix.os }}-node${{ matrix.node-version }}
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Check code formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Run ANVIL Shield
        run: node dist/cli.js shield .
      - name: Test ANVIL GitHub Action
        uses: ./
        with:
          version: local
          operation: gate
          project-path: .
          sarif-file: test-action-gate.sarif
      - name: Pack and install CLI in a clean directory
        run: |
          RUNNER_TEMP_POSIX="${RUNNER_TEMP//\\//}"
          npm pack --pack-destination "$RUNNER_TEMP_POSIX"
          mkdir -p "$RUNNER_TEMP_POSIX/anvil-clean-install"
          npm install --prefix "$RUNNER_TEMP_POSIX/anvil-clean-install" "$RUNNER_TEMP_POSIX"/*engineering-workbench-*.tgz
          "$RUNNER_TEMP_POSIX/anvil-clean-install/node_modules/.bin/anvil" --version
          "$RUNNER_TEMP_POSIX/anvil-clean-install/node_modules/.bin/anvil" --help
          mkdir -p "$RUNNER_TEMP_POSIX/anvil-smoke-project"
          "$RUNNER_TEMP_POSIX/anvil-clean-install/node_modules/.bin/anvil" init "$RUNNER_TEMP_POSIX/anvil-smoke-project"
          "$RUNNER_TEMP_POSIX/anvil-clean-install/node_modules/.bin/anvil" inspect "$RUNNER_TEMP_POSIX/anvil-smoke-project"

  docker-runtime:
    name: Real Docker sandbox integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Pull sandbox image and resolve immutable digest
        id: image
        shell: bash
        run: |
          docker pull node:22-alpine
          IMAGE_REF="$(docker image inspect node:22-alpine --format '{{index .RepoDigests 0}}')"
          if [[ -z "$IMAGE_REF" || "$IMAGE_REF" != *@sha256:* ]]; then
            echo "Could not resolve an immutable image digest" >&2
            exit 1
          fi
          echo "ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          docker info
      - name: Execute real container boundary tests
        env:
          ANVIL_DOCKER_IMAGE: ${{ steps.image.outputs.ref }}
          ANVIL_HOST_SECRET_SENTINEL: must-not-enter-container
        run: npx vitest run tests/container-sandbox.integration.test.ts

