version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    ignore:
      # ANVIL imports the TypeScript compiler API at runtime (call-graph,
      # code-intelligence, code-search, project-cleaner). TypeScript 7 is the
      # native port and does not ship that JS API yet, so builds fail.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "security"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    groups:
      # init and analyze must stay on the same CodeQL version, or the
      # analysis fails with a configuration error.
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
