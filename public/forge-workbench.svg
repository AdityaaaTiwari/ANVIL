<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#151e3f" />
      <stop offset="60%" stop-color="#0a0e1a" />
      <stop offset="100%" stop-color="#05070d" />
    </radialGradient>

    <!-- Chrome & Holographic Gradients -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38f9d7" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="cyber-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#7000ff" />
      <stop offset="85%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ff7b00" />
    </linearGradient>

    <linearGradient id="metallic-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e294b" />
      <stop offset="50%" stop-color="#131b33" />
      <stop offset="100%" stop-color="#0c1122" />
    </linearGradient>

    <linearGradient id="accent-glow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff00a0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="hyper-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base Canvas (Squircle / App Icon) -->
  <rect width="512" height="512" rx="112" fill="url(#bg-glow)" />
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="url(#cyber-core)" stroke-width="2.5" opacity="0.35" />

  <!-- Background Subtle Grid / Circuit Accent -->
  <g opacity="0.08" stroke="#00f2fe" stroke-width="1.5">
    <path d="M64 256h384M256 64v384M128 128l256 256M384 128L128 384" />
    <circle cx="256" cy="256" r="140" fill="none" stroke-dasharray="6 6" />
  </g>

  <!-- MAIN ANVIL ICONOGRAPHY (FUSED WITH "A" MONOGRAM) -->
  <g filter="url(#soft-glow)" transform="translate(0, 8)">
    <!-- Base / Stand of the Anvil -->
    <path d="M120 404 L392 404 L368 360 L144 360 Z" fill="url(#metallic-face)" stroke="url(#neon-cyan)" stroke-width="4" stroke-linejoin="round" />
    <path d="M144 360 L368 360 L336 312 L176 312 Z" fill="url(#metallic-face)" stroke="url(#cyber-core)" stroke-width="4" stroke-linejoin="round" opacity="0.9" />

    <!-- Anvil Waist & Central Column (Forms the A-Pillars) -->
    <!-- Left Leg -->
    <path d="M176 312 L220 186 L256 186 L224 312 Z" fill="url(#metallic-face)" stroke="url(#cyber-core)" stroke-width="3" />
    <!-- Right Leg -->
    <path d="M336 312 L292 186 L256 186 L288 312 Z" fill="url(#metallic-face)" stroke="url(#cyber-core)" stroke-width="3" />

    <!-- A-Bar Chevron / Code Bracket `<>` Core -->
    <path d="M188 266 L256 232 L324 266 L256 280 Z" fill="url(#cyber-core)" filter="url(#hyper-glow)" />

    <!-- Anvil Top Surface & Horn (Futuristic Silhouette) -->
    <!-- Horn on the left, step, flat striking face, and heel on the right -->
    <path d="M68 186 
             C104 184 156 180 188 162 
             L200 136 
             L416 136 
             C432 136 444 148 440 164 
             L424 186 
             L374 186 
             L344 212 
             L168 212 
             L136 186 
             Z" 
          fill="url(#metallic-face)" 
          stroke="url(#cyber-core)" 
          stroke-width="6" 
          stroke-linejoin="round" />

    <!-- Glowing Top Edge Bevel (Striking Face highlight) -->
    <path d="M198 140 L414 140" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.95" />
    <path d="M198 140 L414 140" stroke="url(#neon-cyan)" stroke-width="8" stroke-linecap="round" filter="url(#hyper-glow)" opacity="0.8" />

    <!-- Precision Laser / Neon Horn Flare -->
    <path d="M72 186 C110 184 160 178 190 160" fill="none" stroke="url(#neon-cyan)" stroke-width="4" stroke-linecap="round" />

    <!-- Center Apex Glowing Core / Energy Spark -->
    <polygon points="256,112 264,136 288,144 264,152 256,176 248,152 224,144 248,136" fill="url(#neon-cyan)" filter="url(#hyper-glow)" />
    <circle cx="256" cy="144" r="3" fill="#ffffff" />
  </g>

  <!-- Tech Accent Details: Circuit Nodes -->
  <g fill="#00f2fe" opacity="0.85">
    <circle cx="120" cy="404" r="4" />
    <circle cx="392" cy="404" r="4" />
    <circle cx="256" cy="404" r="3" />
    <circle cx="72" cy="186" r="3.5" />
    <circle cx="424" cy="186" r="3.5" />
  </g>
</svg>
