<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="av-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141a38"/>
      <stop offset="70%" stop-color="#090d1c"/>
      <stop offset="100%" stop-color="#04060c"/>
    </radialGradient>
    <linearGradient id="av-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="45%" stop-color="#7000ff"/>
      <stop offset="85%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="av-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38f9d7"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="av-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Profile Backdrop -->
  <circle cx="256" cy="256" r="250" fill="url(#av-bg)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="url(#av-neon)" stroke-width="4" opacity="0.6"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.2"/>

  <!-- Centered Scaled Anvil Core -->
  <g filter="url(#av-glow)" transform="translate(0, 10)">
    <!-- Base -->
    <path d="M130 380 L382 380 L360 340 L152 340 Z" fill="#111833" stroke="url(#av-cyan)" stroke-width="3"/>
    <path d="M152 340 L360 340 L330 300 L182 300 Z" fill="#151e3f" stroke="url(#av-neon)" stroke-width="3"/>

    <!-- A-Legs -->
    <path d="M182 300 L224 195 L256 195 L224 300 Z" fill="#111833" stroke="url(#av-neon)" stroke-width="2.5"/>
    <path d="M330 300 L288 195 L256 195 L288 300 Z" fill="#111833" stroke="url(#av-neon)" stroke-width="2.5"/>

    <!-- A-Bar Chevron `<>` -->
    <path d="M194 260 L256 226 L318 260 L256 272 Z" fill="url(#av-neon)"/>

    <!-- Anvil Head / Striking Surface -->
    <path d="M85 195 C120 193 166 189 194 172 L204 150 L400 150 C416 150 426 160 422 174 L410 195 L364 195 L336 218 L176 218 L148 195 Z" 
          fill="#111833" stroke="url(#av-neon)" stroke-width="5" stroke-linejoin="round"/>

    <!-- Glowing Top Bevel -->
    <line x1="202" y1="152" x2="398" y2="152" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="202" y1="152" x2="398" y2="152" stroke="#00f2fe" stroke-width="6" opacity="0.7" stroke-linecap="round"/>

    <!-- Energy Star at Center -->
    <polygon points="256,128 262,146 280,152 262,158 256,176 250,158 232,152 250,146" fill="#00f2fe"/>
    <circle cx="256" cy="152" r="2.5" fill="#ffffff"/>
  </g>
</svg>
