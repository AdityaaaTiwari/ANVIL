name: ANVIL Engineering Workbench
description: Install ANVIL and run local-first AI engineering checks on a repository
author: Aditya Tiwari

branding:
  icon: terminal
  color: orange

inputs:
  version:
    description: ANVIL Git ref to install (tag, branch, or commit)
    required: false
    default: v1.0.7
  project-path:
    description: Repository directory to analyze
    required: false
    default: .
  operation:
    description: Safe built-in operation to run (gate, inspect, security, quality, health, review, doctor, clean, undo)
    required: false
    default: gate
  sarif-file:
    description: File path to write the OASIS SARIF v2.1.0 report (e.g. anvil-results.sarif)
    required: false
    default: anvil-results.sarif
  fail-on-warnings:
    description: Whether the gate should fail on medium-severity warnings (true/false)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Node.js 22
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        node-version: 22
    - name: Install ANVIL
      shell: bash
      env:
        ANVIL_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        npm install --global "git+https://github.com/anvil-workbench/ANVIL.git#${ANVIL_VERSION}"
        anvil --version
    - name: Run ANVIL
      shell: bash
      env:
        ANVIL_PROJECT_PATH: ${{ inputs.project-path }}
        ANVIL_OPERATION: ${{ inputs.operation }}
        ANVIL_SARIF_FILE: ${{ inputs.sarif-file }}
        ANVIL_FAIL_ON_WARNINGS: ${{ inputs.fail-on-warnings }}
      run: |
        set -euo pipefail
        case "$ANVIL_OPERATION" in
          gate)
            EXTRA_ARGS=""
            if [[ -n "$ANVIL_SARIF_FILE" ]]; then EXTRA_ARGS="$EXTRA_ARGS --sarif $ANVIL_SARIF_FILE"; fi
            if [[ "$ANVIL_FAIL_ON_WARNINGS" == "true" ]]; then EXTRA_ARGS="$EXTRA_ARGS --fail-on-warnings"; fi
            anvil gate "$ANVIL_PROJECT_PATH" $EXTRA_ARGS
            ;;
          inspect) anvil inspect "$ANVIL_PROJECT_PATH" ;;
          security) anvil security "$ANVIL_PROJECT_PATH" ;;
          quality) anvil quality "$ANVIL_PROJECT_PATH" ;;
          health) anvil health "$ANVIL_PROJECT_PATH" ;;
          review) anvil review "$ANVIL_PROJECT_PATH" ;;
          doctor) anvil doctor "$ANVIL_PROJECT_PATH" ;;
          clean) anvil clean "$ANVIL_PROJECT_PATH" ;;
          undo) anvil undo "$ANVIL_PROJECT_PATH" ;;
          *) echo "Unsupported ANVIL operation: $ANVIL_OPERATION" >&2; exit 2 ;;
        esac
